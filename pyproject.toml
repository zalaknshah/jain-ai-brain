[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jace"
version = "0.1.0"
description = "Local-first Jain AI Cognitive Engine reference implementation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
simulation = ["mujoco==3.17.0"]
# The qualified experimental gait stack requires Python 3.12+ (NumPy metadata).
gait = ["mujoco==3.17.0", "numpy==2.5.4"]

[project.scripts]
jace = "jace.cli:main"
jace-train = "jace.training_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jace = ["data/*.json", "data/*.xml", "data/*.txt", "data/*.js"]
