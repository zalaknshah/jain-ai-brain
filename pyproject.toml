[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jace"
version = "0.1.0"
description = "Local-first Jain AI Cognitive Engine reference implementation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jace = "jace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
